              - {label: "Historia: título", name: historia_titulo, widget: string}
              - {label: "Historia: texto (deja una línea en blanco entre párrafos)", name: historia_texto, widget: text}
              - {label: "Historia: frase destacada", name: historia_cita, widget: string}
              - label: "Historia: recorrido del río (4 paradas)"
                name: recorrido
                widget: list
                summary: "{{fields.lugar}}"
                fields:
                  - {label: Lugar, name: lugar, widget: string}
                  - {label: Texto, name: texto, widget: string}
              - {label: "Reservas: título", name: reservas_titulo, widget: string}
              - {label: "Reservas: texto", name: reservas_texto, widget: text}
              - {label: "Formulario: Nombre", name: form_nombre, widget: string}
